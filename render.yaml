services:
  - type: web
    name: brandproof-ml
    runtime: python
    buildCommand: pip install -r requirements-ml.txt
    startCommand: uvicorn ml_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8

  - type: web
    name: brandproof-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_TIMEOUT_MS
        value: "20000"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: brandproof-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK_API
        value: "false"
      - key: VITE_API_BASE_URL
        sync: false
